# Cloudflare Worker for Baddie Times short links (baddietimes.com/<name>).
# Deployed automatically by Cloudflare from this GitHub repo; code lives in api/.
name = "baddie-links"
main = "api/src/index.js"
compatibility_date = "2026-11-01"
workers_dev = true
routes = [
  { pattern = "api.baddietimes.com", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "baddie-links"
database_id = "4bebb0b6-b078-4c76-82c1-d39e22b9eb1c"
