<script>
  // Short links: GitHub Pages serves this page for any path it doesn't know
  // (e.g. /slogantimes). Hand the name to the main page, which looks it up.

    var p = location.pathname.replace(/^\/+|\/+$/g, "");
    location.replace("/?go=" + encodeURIComponent(p) + location.hash);
  })();
</script>
